<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KitchenUnity Lead SMS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      background: white;
      color: #1a1a1a;
    }

    .header {
      background: #1a73e8;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon { font-size: 20px; }

    .header-text h2 {
      font-size: 14px;
      font-weight: 600;
    }

    .header-text p {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 1px;
    }

    .body { padding: 14px 16px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-row.active {
      background: #d1fae5;
      color: #065f46;
    }

    .status-row.inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.green { background: #10b981; }
    .dot.red { background: #ef4444; }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: #1a73e8;
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
    }

    .last-sent {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .last-sent-label {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .last-sent-name {
      font-size: 13px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .last-sent-time {
      font-size: 12px;
      color: #6b7280;
      margin-top: 1px;
    }

    .footer {
      border-top: 1px solid #f3f4f6;
      padding: 10px 16px;
    }

    .footer a {
      font-size: 12.5px;
      color: #1a73e8;
      text-decoration: none;
      cursor: pointer;
    }

    .footer a:hover { text-decoration: underline; }

    .not-configured {
      padding: 8px 0;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">💬</div>
    <div class="header-text">
      <h2>Lead SMS</h2>
      <p>Auto-texts from Google Voice</p>
    </div>
  </div>

  <div class="body" id="body">
    <div class="not-configured">Loading...</div>
  </div>

  <div class="footer">
    <a id="optionsLink">Open Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
